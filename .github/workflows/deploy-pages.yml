name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify ontology source and event model
        run: |
          npm run check:ontology
          npm run test:ontology
          npm run test:cmapss
          npm run test:cmapss:semantic
          npm run test:cmapss:contracts
          npm run test:cmapss:datasets
          npm run test:cmapss:story
          npm run test:cmapss:comparison
          npm run test:twin
          npm run test:model
          npm run test:xgboost
          npm run test:vibration
          npm run test:wt:research

      - name: Build dashboard
        run: npm run build

      - name: Prepare GitHub Pages routes
        run: |
          mkdir -p dist/enhanced dist/cmapss
          cp dist/index.html dist/enhanced/index.html
          cp dist/index.html dist/cmapss/index.html
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
