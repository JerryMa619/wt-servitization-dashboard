name: Verify C-MAPSS prototype
on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/cmapss-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:ontology
      - run: npm run test:ontology
      - run: npm run test:twin
      - run: npm run test:cmapss
      - run: npm run build
